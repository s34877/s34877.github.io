<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - ติดต่อ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
        body { background: linear-gradient(135deg, #0b0c10, #1f2833, #0f2027, #203a43, #2c5364); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: #fff; min-height: 100vh; position: relative; overflow-x: hidden; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .star { position: absolute; bottom: -20px; color: #fff; font-size: 12px; opacity: 0.8; animation: floatUp linear infinite, twinkle ease-in-out infinite alternate; filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8)); }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; } }
        @keyframes twinkle { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        header { background: rgba(15, 32, 39, 0.85); backdrop-filter: blur(10px); position: fixed; top: 0; width: 100%; display: flex; justify-content: center; padding: 15px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 1000; }
        nav a { color: #cfd8dc; text-decoration: none; margin: 0 15px; font-size: 14px; font-weight: 400; transition: all 0.3s ease; padding-bottom: 3px; position: relative; }
        nav a::after { content: ''; position: absolute; width: 0; height: 2px; bottom: 0; left: 0; background-color: #64b5f6; transition: width 0.3s ease; }
        nav a:hover::after, nav a.active::after { width: 100%; }
        nav a:hover, nav a.active { color: #64b5f6; text-shadow: 0 0 10px rgba(100, 181, 246, 0.5); }
        .content-container { margin-top: 100px; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 100px); position: relative; z-index: 10; }
        .section-page { text-align: center; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); max-width: 900px; width: 100%; border: 1px solid rgba(255, 255, 255, 0.1); }
        @keyframes floatBox { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .contact-card { background: rgba(255, 255, 255, 0.95); color: #333; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); max-width: 600px; margin: 0 auto; animation: floatBox 4s ease-in-out infinite; text-align: left; }
        .contact-card h2 { color: #1565c0; text-align: center; margin-bottom: 25px; font-size: 28px; }
        .contact-item { display: flex; align-items: center; font-size: 16px; margin-bottom: 18px; color: #444; word-break: break-all; }
        .contact-icon { font-size: 24px; margin-right: 15px; min-width: 35px; text-align: center; }
        .contact-item a { color: #0d47a1; text-decoration: none; transition: color 0.3s; }
        .contact-item a:hover { color: #2196F3; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="stars-container" id="starsContainer"></div>
    <header>
        <nav>
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT ME</a>
            <a href="university.html">UNIVERSITY</a>
            <a href="works.html">WORKS</a>
            <a href="contact.html" class="active">CONTACT</a>
        </nav>
    </header>
    <div class="content-container">
        <div class="section-page">
            <div class="contact-card">
                <h2>ช่องทางการติดต่อ</h2>
                <div class="contact-item">
                    <span class="contact-icon">📧</span>
                    <span><strong>Gmail :</strong> <a href="mailto:pornapha2008@gmail.com">pornapha2008@gmail.com</a></span>
                </div>
                <div class="contact-item">
                    <span class="contact-icon">📞</span>
                    <span><strong>เบอร์ติดต่อ :</strong> <a href="tel:0626685282">0626685282</a></span>
                </div>
                <div class="contact-item">
                    <span class="contact-icon">💬</span>
                    <span><strong>Line ID :</strong> mookke2008</span>
                </div>
                <div class="contact-item">
                    <span class="contact-icon">🌐</span>
                    <span><strong>Facebook :</strong> พรนภา บุญคำ</span>
                </div>
            </div>
        </div>
    </div>
    <script>
        function createStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 35; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.innerHTML = ['★', '✦', '✧', '✦', '❄'][Math.floor(Math.random() * 5)];
                star.style.left = Math.random() * 100 + 'vw';
                star.style.fontSize = (Math.random() * 15 + 10) + 'px';
                star.style.animationDuration = `${Math.random() * 8 + 6}s, ${Math.random() * 2 + 1}s`;
                star.style.animationDelay = `${Math.random() * 10}s, 0s`;
                container.appendChild(star);
            }
        }
        createStars();
    </script>
</body>
</html>
