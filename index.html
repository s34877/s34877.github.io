<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแนะนำตัว - พรนภา บุญคำ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0c10, #1f2833, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 550px;
            width: 100%;
            padding: 40px;
            text-align: center;
            animation: floatCard 4s ease-in-out infinite;
        }

        h1 {
            color: #1565c0;
            font-size: 26px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* สไตล์รูปภาพที่ 1 พร้อมอนิเมชันสุดเท่ */
        .profile-img-1 {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border: 4px solid #1565c0;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: block;
            box-shadow: 0 5px 15px rgba(21, 101, 192, 0.4);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .profile-img-1:hover {
            transform: scale(1.08) rotate(2deg);
            border-color: #2196F3;
            box-shadow: 0 0 25px rgba(33, 150, 243, 0.8);
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            color: #444;
            margin-bottom: 10px;
        }

        .highlight {
            font-weight: 600;
            color: #0d47a1;
        }

        .btn-portfolio {
            display: inline-block;
            background: linear-gradient(135deg, #2196F3, #1565c0);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
            transition: all 0.3s ease;
        }

        .btn-portfolio:hover {
            background: linear-gradient(135deg, #1e88e5, #0d47a1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.6);
        }

        /* Lightbox สำหรับแสดงรูปใหญ่เมื่อคลิก */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border: 4px solid #64b5f6;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(100, 181, 246, 0.6);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #lightbox.active img {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s;
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .close-btn:hover {
            color: #64b5f6;
            border-color: #64b5f6;
        }
    </style>
</head>
<body>

    <!-- Lightbox สำหรับแสดงรูปใหญ่ -->
    <div id="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Zoomed Image">
    </div>

    <div class="card">
        <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>
        
        <!-- แท็กรูปภาพ 1.jpg พร้อมระบบคลิกดูรูปใหญ่ -->
        <img src="1.jpg" alt="รูปภาพที่ 1" class="profile-img-1" onclick="openLightbox(this.src)">

        <p>สวัสดีค่ะ! ฉันชื่อ <span class="highlight">พรนภา บุญคำ</span></p>
        <p><span class="highlight">Pornnapha Boonkham</span></p>
        <p>ขณะนี้กำลังเรียนอยู่แผนการเรียน <span class="highlight">Gifted Program</span></p>
        <p>นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages!</p>
        
        <a href="portfolio.html" class="btn-portfolio">ดูแฟ้มสะสมผลงานของฉัน</a>
    </div>

    <script>
        // ฟังก์ชันเปิดรูปใหญ่ (Lightbox)
        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imgSrc;
            lightbox.classList.add('active');
        }

        // ฟังก์ชันปิดรูปใหญ่
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
        }
    </script>

</body>
</html>
